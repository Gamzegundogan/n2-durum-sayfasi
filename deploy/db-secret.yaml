# ONEMLI: Bu dosya ogrenme/demo amaclidir. Gercek bir projede sifreler
# asla public bir repoya (duz metin olarak) commitlenmemeli -- bunun
# yerine CI/CD secret yonetimi (orn. GitHub Secrets, Vault, Sealed
# Secrets) kullanilir. Burada basitlik icin dogrudan yaziyoruz.
apiVersion: v1
kind: Secret
metadata:
  name: n2-db-secret
  namespace: n2-durum
type: Opaque
stringData:
  DB_USER: n2user
  DB_PASSWORD: n2pass
  DB_NAME: n2db