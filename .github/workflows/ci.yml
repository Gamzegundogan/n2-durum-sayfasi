# GitHub Actions workflow. .github/workflows/ci.yml yolunda olmalı.
name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: n2-durum-sayfasi

jobs:
  # Statik dosya/config testleri: minikube'a ihtiyacı yok, GitHub'ın
  # kendi bulut sunucusunda (ubuntu-latest) hızlıca çalışır.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Statik dosya ve config testleri
        run: bash scripts/test.sh

  # Build artık SELF-HOSTED runner'da (senin laptopunda) çalışıyor,
  # çünkü ürettiği image'ı birazdan aynı makinedeki minikube'a
  # yükleyeceğiz -- bulut sunucusunda build edilse, senin laptopundaki
  # minikube'a hiç ulaşamazdı.
  build:
    needs: test
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: powershell
        run: |
          $sha = (git rev-parse --short HEAD)
          echo "tag=$sha" >> $env:GITHUB_OUTPUT
      - name: Docker image build
        shell: powershell
        run: |
          docker build --build-arg GIT_SHA=${{ steps.vars.outputs.tag }} `
            -t ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} .

  scan:
    needs: build
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: "Trivy taramasi (bilgi amacli, pipeline'i durdurmuyor)"
        shell: powershell
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock `
            aquasec/trivy:latest image --severity HIGH,CRITICAL `
            ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}

  # Asil CD kismi: image'i minikube'a yukle, deployment'i guncelle,
  # rollout'un basarili olmasini bekle.
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Image'i minikube'a yukle
        shell: powershell
        run: minikube image load ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}
      - name: Deployment'i yeni image tag'ine guncelle
        shell: powershell
        run: |
          kubectl set image deployment/n2-durum-sayfasi `
            site=${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }} `
            -n n2-durum
      - name: Rollout'un tamamlanmasini bekle
        shell: powershell
        run: kubectl rollout status deployment/n2-durum-sayfasi -n n2-durum --timeout=120s

  smoke-test:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: "Smoke test (cluster icinden, Service DNS uzerinden - host networking sorunlarini bypass eder)"
        shell: powershell
        run: |
          function CheckPath($path, $expected) {
            $podName = "smoke-" + [guid]::NewGuid().ToString().Substring(0,8)
            $code = kubectl run $podName -n n2-durum --restart=Never --rm -i `
              --image=curlimages/curl:8.9.1 --command -- `
              curl -s -o /dev/null -w "%{http_code}" "http://n2-durum-sayfasi$path" 2>$null
            $code = ($code | Select-Object -Last 1).Trim()
            if ($code -eq $expected) {
              Write-Host "OK   - GET $path -> $code"
              return $true
            } else {
              Write-Host "FAIL - GET $path -> $code (beklenen: $expected)"
              return $false
            }
          }

          $r1 = CheckPath "/" "200"
          $r2 = CheckPath "/healthz" "200"
          $r3 = CheckPath "/bu-yol-yok" "404"

          if ($r1 -and $r2 -and $r3) {
            Write-Host "Smoke test basarili."
            exit 0
          } else {
            Write-Host "Smoke test basarisiz."
            exit 1
          }