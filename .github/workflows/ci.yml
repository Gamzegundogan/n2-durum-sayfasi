# GitHub Actions workflow. Gerçek repoda .github/workflows/pipeline.yml
# yoluna konmalıdır (isim serbest, işlev zorunlu).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE_NAME: n2-durum-sayfasi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Statik dosya ve config testleri
        run: bash scripts/test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
      - name: "Image build (immutable tag: commit SHA)"
        run: |
          docker build \
            --build-arg GIT_SHA=${{ steps.vars.outputs.tag }} \
            -t ${IMAGE_NAME}:${{ steps.vars.outputs.tag }} .
      - name: Image'ı artifact olarak sakla (sonraki job'lara aktarmak için)
        run: docker save ${IMAGE_NAME}:${{ steps.vars.outputs.tag }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      # Trivy ile bilinen zafiyet taraması. HIGH/CRITICAL bulgu varsa
      # pipeline durur -- yayınlama başarısız kalitede image ile yapılamaz.
      - name: Trivy taraması
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  publish:
    needs: [build, scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      # NOT: Gerçek ortamda buraya registry login (secrets.REGISTRY_TOKEN gibi
      # bir GitHub Actions secret'ından) ve `docker push` eklenir.
      # Secret hiçbir zaman bu dosyada düz metin olarak yazılmaz.
      - name: (Yer tutucu) registry'ye push
        run: echo "docker push ghcr.io/ORG/${IMAGE_NAME}:${{ needs.build.outputs.tag }}"

  deploy-and-smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOT: Gerçek ortamda burada `kubectl set image` ile yeni tag deploy
      # edilir, rollout status beklenir, sonra smoke test çalışır.
      # Bu proje kapsamında manuel gösterildiği için burada yalnızca akış
      # belgeleniyor.
      - name: Rollout durumunu bekle (örnek)
        run: echo "kubectl -n n2-durum rollout status deploy/n2-durum-sayfasi --timeout=120s"
      - name: Smoke test
        run: echo "bash scripts/smoke-test.sh https://STAGING_URL"
