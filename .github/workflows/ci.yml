name: CI

on:
  push:
    branches: [main]

env:
  FRONTEND_IMAGE: n2-durum-sayfasi
  BACKEND_IMAGE: n2-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Statik dosya ve config testleri
        run: bash scripts/test.sh

  build-frontend:
    needs: test
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: powershell
        run: |
          $sha = (git rev-parse --short HEAD)
          echo "tag=$sha" >> $env:GITHUB_OUTPUT
      - name: Frontend image build
        shell: powershell
        run: |
          docker build --build-arg GIT_SHA=${{ steps.vars.outputs.tag }} `
            -t ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.tag }} .

  build-backend:
    needs: test
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: powershell
        run: |
          $sha = (git rev-parse --short HEAD)
          echo "tag=$sha" >> $env:GITHUB_OUTPUT
      - name: Backend image build
        shell: powershell
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.tag }} ./backend

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Image'lari minikube'a yukle
        shell: powershell
        run: |
          minikube image load ${{ env.FRONTEND_IMAGE }}:${{ needs.build-frontend.outputs.tag }}
          minikube image load ${{ env.BACKEND_IMAGE }}:${{ needs.build-backend.outputs.tag }}
      - name: Kubernetes kaynaklarini uygula (declarative)
        shell: powershell
        run: |
          kubectl apply -f deploy/namespace.yaml
          kubectl apply -f deploy/deployment.yaml
          kubectl apply -f deploy/service.yaml
          kubectl apply -f deploy/backend.yaml
      - name: Deployment'lari yeni image tag'lerine guncelle
        shell: powershell
        run: |
          kubectl set image deployment/n2-durum-sayfasi `
            site=${{ env.FRONTEND_IMAGE }}:${{ needs.build-frontend.outputs.tag }} `
            -n n2-durum
          kubectl set image deployment/n2-backend `
            backend=${{ env.BACKEND_IMAGE }}:${{ needs.build-backend.outputs.tag }} `
            -n n2-durum
      - name: Rollout'larin tamamlanmasini bekle
        shell: powershell
        run: |
          kubectl rollout status deployment/n2-durum-sayfasi -n n2-durum --timeout=120s
          kubectl rollout status deployment/n2-backend -n n2-durum --timeout=120s

  smoke-test:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: "Smoke test (frontend pod icinden, / ve /api/status)"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $podName = kubectl get pods -n n2-durum -l app=n2-durum-sayfasi -o jsonpath="{.items[0].metadata.name}"
          Write-Host "Test edilecek pod: $podName"

          function CheckPath($path, $expectSuccess) {
            kubectl exec -n n2-durum $podName -- wget -q -O /dev/null "http://127.0.0.1:8080$path"
            $ok = ($LASTEXITCODE -eq 0)
            if ($ok -eq $expectSuccess) {
              Write-Host "OK   - GET $path (exit code: $LASTEXITCODE)"
              return $true
            } else {
              Write-Host "FAIL - GET $path (exit code: $LASTEXITCODE, basari beklentisi: $expectSuccess)"
              return $false
            }
          }

          $r1 = CheckPath "/" $true
          $r2 = CheckPath "/healthz" $true
          $r3 = CheckPath "/bu-yol-yok" $false
          $r4 = CheckPath "/api/status" $true

          if ($r1 -and $r2 -and $r3 -and $r4) {
            Write-Host "Smoke test basarili (frontend + backend)."
            exit 0s
          } else {
            Write-Host "Smoke test basarisiz."
            exit 1
          }