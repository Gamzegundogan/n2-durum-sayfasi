server {
    listen       8080;
    server_name  _;

    # Root olmayan kullanıcı 80 portunu dinleyemediği için 8080 kullanılıyor.
    root   /usr/share/nginx/html;
    index  index.html;

    # Sağlık kontrolü: sabit, hızlı, dış bağımlılığa sorgu atmaz.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Statik dosyalar
    location / {
        try_files $uri $uri/ =404;
    }

    # Olmayan yollar için nginx'in varsayılan 404 gövdesi kullanılıyor
    # (try_files zaten =404 ile bunu tetikliyor).

    # Konteyner içinde yazma izni olmayan dizinlere log yazmaya çalışmasın diye
    access_log /dev/stdout;
    error_log  /dev/stderr;
}
