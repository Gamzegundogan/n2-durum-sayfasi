services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n2user
      POSTGRES_PASSWORD: n2pass
      POSTGRES_DB: n2db
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGUSER: n2user
      PGPASSWORD: n2pass
      PGDATABASE: n2db
      PGPORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - db

  site:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    ports:
      - "8080:8080"
    depends_on:
      - backend
