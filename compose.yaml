services:
  site:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: n2-durum-sayfasi:${TAG:-dev}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
